[databases]
; Any database name is forwarded to the postgres service.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: a server connection is held only for the duration of a
; transaction, then returned. Many idle application sessions (pooled SQLAlchemy
; connections, SSE pollers, mcp-db's pool) share a small set of real backends.
pool_mode = transaction
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 1000
max_db_connections = 40

; Protocol-level prepared statements are tracked and re-prepared per server
; connection (PgBouncer >= 1.21), so asyncpg's extended protocol works here.
max_prepared_statements = 200

; asyncpg sends these on connect; PgBouncer would otherwise reject them.
ignore_startup_parameters = extra_float_digits,options

server_idle_timeout = 60
admin_users = hive
stats_users = hive
log_connections = 0
log_disconnections = 0
