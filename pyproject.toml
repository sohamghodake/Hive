[project]
name = "hive"
version = "0.1.0"
description = "Multi-agent orchestration platform"
requires-python = ">=3.12"
# What the code imports. Exact versions of these and everything they pull in
# live in uv.lock; the api image installs from it, and each MCP image installs
# its group below as exported to mcp_servers/*/requirements.txt (`make lock`).
dependencies = [
    "fastapi>=0.142.2",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    # Exact: fastmcp's API moves between releases, and the api and mcp-db
    # images must embed with the same fastembed build.
    "fastmcp==4.0.10",
    "fastembed==0.8.1",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "httpx>=0.28.1",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
# One per MCP server image. Unversioned: the lock resolves them together with
# the dependencies above, so a server runs the same versions the tests do.
mcp-file = ["fastmcp", "starlette", "uvicorn[standard]", "aiofiles"]
mcp-db = ["fastmcp", "starlette", "uvicorn[standard]", "asyncpg", "fastembed"]
mcp-search = ["fastmcp", "starlette", "uvicorn[standard]", "httpx"]
mcp-api = ["fastmcp", "starlette", "uvicorn[standard]", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "orchestrator", "db", "rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A fresh loop per test, which the per-test engine in tests/conftest.py relies on.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
