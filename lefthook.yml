# The same checks as CI (.github/workflows/ci.yml), with the same locked tool
# versions. Enable once per clone with `lefthook install`.
pre-commit:
  commands:
    lint:
      glob: "*.py"
      run: uv run --only-dev ruff check {staged_files}

pre-push:
  commands:
    # Needs the hive_test database; see README "Tests".
    tests:
      run: uv run pytest -x -q
