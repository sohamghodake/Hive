services:
  # ── API ───────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hive:hivepass@postgres:5432/hive
      MCP_FILE_URL: http://mcp-file:8001
      MCP_DB_URL: http://mcp-db:8002
      MCP_SEARCH_URL: http://mcp-search:8003
      MCP_API_URL: http://mcp-api:8004
      WORKSPACE_PATH: /workspace
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: llama-3.3-70b-versatile
    volumes:
      - workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── MCP Servers ────────────────────────────────────────────────────────────────
  mcp-file:
    build:
      context: ./mcp_servers/mcp_file
    ports:
      - "8001:8001"
    volumes:
      - workspace:/workspace
    environment:
      WORKSPACE_PATH: /workspace
    restart: unless-stopped

  mcp-db:
    build:
      context: ./mcp_servers/mcp_db
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hive:hivepass@postgres:5432/hive
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-search:
    build:
      context: ./mcp_servers/mcp_search
    ports:
      - "8003:8003"
    env_file: .env
    restart: unless-stopped

  mcp-api:
    build:
      context: ./mcp_servers/mcp_api
    ports:
      - "8004:8004"
    env_file: .env
    restart: unless-stopped

  # ── Data ──────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepass
      POSTGRES_DB: hive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  workspace:
