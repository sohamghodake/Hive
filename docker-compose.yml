services:
  # ── API ───────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Application traffic goes through PgBouncer; migrations go direct.
      DATABASE_URL: postgresql+asyncpg://hive:hivepass@pgbouncer:6432/hive
      MIGRATION_DATABASE_URL: postgresql+asyncpg://hive:hivepass@postgres:5432/hive
      # Read by migration 003 to set hive_reader's password.
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-hivereader}
      MCP_FILE_URL: http://mcp-file:8001
      MCP_DB_URL: http://mcp-db:8002
      MCP_SEARCH_URL: http://mcp-search:8003
      MCP_API_URL: http://mcp-api:8004
      WORKSPACE_PATH: /workspace
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      LLM_TPM_BUDGET: ${LLM_TPM_BUDGET:-8000}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      MAX_TOOL_OUTPUT_CHARS: ${MAX_TOOL_OUTPUT_CHARS:-6000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-6}
    volumes:
      - workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      mcp-file:
        condition: service_healthy
      mcp-db:
        condition: service_healthy
      mcp-search:
        condition: service_healthy
      mcp-api:
        condition: service_healthy
    restart: unless-stopped

  # ── MCP Servers ────────────────────────────────────────────────────────────────
  # Each speaks the Model Context Protocol over streamable HTTP at /mcp.
  # No published ports: these have no auth and are reached only by the api over
  # the internal network. To inspect one, publish its port temporarily and point
  # an MCP client (e.g. `npx @modelcontextprotocol/inspector`) at
  # http://localhost:<port>/mcp.
  mcp-file:
    build:
      context: ./mcp_servers/mcp_file
    volumes:
      - workspace:/workspace
    environment:
      WORKSPACE_PATH: /workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mcp-db:
    build:
      context: .   # repo root, to share rag/ with the api image
      dockerfile: mcp_servers/mcp_db/Dockerfile
    env_file: .env
    environment:
      # The model's SQL runs as hive_reader (migration 003): SELECT on the app
      # tables only. As the `hive` superuser it could read server files.
      DATABASE_URL: postgresql://hive_reader:${MCP_DB_PASSWORD:-hivereader}@pgbouncer:6432/hive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped

  mcp-search:
    build:
      context: ./mcp_servers/mcp_search
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mcp-api:
    build:
      context: ./mcp_servers/mcp_api
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ── Data ──────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepass
      POSTGRES_DB: hive
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — default credentials
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    build:
      context: ./pgbouncer
    environment:
      DB_USER: hive
      DB_PASSWORD: hivepass
      READER_USER: hive_reader
      READER_PASSWORD: ${MCP_DB_PASSWORD:-hivereader}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  workspace:
